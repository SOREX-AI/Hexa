name: Build Hexa for all platforms

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'latest-development' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            artifact: hexa-windows-x64
          - name: macOS
            runner: macos-latest
            platform: macos
            artifact: hexa-macos
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            artifact: hexa-linux-x64

    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the configured Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake libcap-dev libssl-dev pkg-config libopenjp2-tools

      - name: Cache packaging tools
        uses: actions/cache@v4
        with:
          path: |
            shell/.cache/rusty-v8
            .ci-cache/electron
            .ci-cache/electron-builder
          key: hexa-packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/Cargo.lock', 'pnpm-lock.yaml', 'shell/package.json') }}
          restore-keys: |
            hexa-packaging-${{ runner.os }}-${{ runner.arch }}-

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --filter hexa...

      - name: Validate source and configuration
        shell: bash
        run: |
          node hexa.mjs typecheck
          node hexa.mjs engine-check

      - name: Detect optional signing credentials
        id: signing
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_LINK || matrix.platform == 'macos' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.platform == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          available=false
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            available=true
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              available=false
            fi
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = true ]; then
            echo "Signing credentials found; this package will be signed."
          else
            echo "Signing credentials are incomplete; continuing with an unsigned package."
          fi

      - name: Build unsigned engine, desktop client, and installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          # Leave CSC_LINK completely unset. An empty CSC_LINK is interpreted
          # as the project directory and makes Electron Builder report
          # "shell not a file" on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node hexa.mjs dist

      - name: Build signed engine, desktop client, and installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_LINK || matrix.platform == 'macos' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.platform == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: node hexa.mjs dist

      - name: Build unsigned tagged engine, desktop client, and installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux' && steps.signing.outputs.available != 'true'
        shell: bash
        env:
          # Keep CSC_LINK unset: Electron Builder treats an explicitly empty
          # value as a path and fails on macOS instead of building unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node hexa.mjs dist

      - name: Build tagged Linux engine, desktop client, and installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node hexa.mjs dist

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish update assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish installers and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.exe.blockmap
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.zip.blockmap
            release-assets/**/*.AppImage
            release-assets/**/*.AppImage.blockmap
            release-assets/**/latest.yml
            release-assets/**/latest-mac.yml
            release-assets/**/latest-linux.yml
